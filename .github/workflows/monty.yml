name: Native Monty
on:
  pull_request:
    paths: ['Cargo.*', '.cargo/**', 'src/**', 'vendor/**', 'xtask/**', 'patches/**', 'upstream/**', 'tests/**', 'crates/**', 'examples/**', 'python/**', 'pyproject.toml', 'tools/monty-checks/**', 'tools/linux-checks/**', 'tools/release.py', 'tools/test_release.py', '.github/workflows/monty.yml', '.github/workflows/release.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: monty-${{ hashFiles('Cargo.lock', 'upstream/Cargo.lock', 'patches/*.patch', 'upstream/revision') }}-${{ github.sha }}
          restore-keys: |
            monty-${{ hashFiles('Cargo.lock', 'upstream/Cargo.lock', 'patches/*.patch', 'upstream/revision') }}-
            monty-
      - run: pip install mypy==2.3.1
      - run: pip install '.[test]'
      - run: python -m pytest python/tests -q
      - run: python -m unittest discover -s tools -p test_release.py -v
      - run: python -m unittest discover -s tools/linux-checks -v
      - run: MYPYPATH=crates/monty-runtime/src mypy --strict examples/monty/worker.py
      - run: MYPYPATH=crates/monty-runtime/src mypy --strict examples/http/worker.py
      - run: MYPYPATH=crates/monty-runtime/src mypy --strict tools/monty-checks/bench/worker.py
      - run: cargo xtask test
      - run: cargo xtask build
      - name: Cache the completed build before process-level checks
        uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - run: python tools/monty-checks/e2e.py target/lab/celld
      - run: python tools/monty-checks/http_handlers.py target/lab/celld
      - run: python -m pytest python/tests examples/python-api/tests --celld-binary target/lab/celld -q
      - run: python tools/monty-checks/network_policy.py target/lab/celld
      - run: python tools/monty-checks/execution_policy.py target/lab/celld
      - run: python tools/monty-checks/consumer.py
