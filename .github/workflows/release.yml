name: Native binaries

# Main publishes tested binaries. A labeled PR builds review artifacts only.
on:
  pull_request:
    types: [labeled, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Main pushes each get a release; only superseded PR builds are cancelled.
  group: native-binaries-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.98.1
  CARGO_BUILD_JOBS: '2'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'build-binaries')
    uses: ./.github/workflows/monty.yml

  build:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'build-binaries')
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust and verify native target
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pycelld-${{ runner.os == 'Linux' && 'glibc228' || 'native' }}-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'upstream/Cargo.lock', 'patches/*.patch', 'upstream/revision', 'tools/linux-checks/build.sh') }}-${{ env.SOURCE_SHA }}
          restore-keys: |
            pycelld-${{ runner.os == 'Linux' && 'glibc228' || 'native' }}-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'upstream/Cargo.lock', 'patches/*.patch', 'upstream/revision', 'tools/linux-checks/build.sh') }}-
            pycelld-${{ runner.os == 'Linux' && 'glibc228' || 'native' }}-${{ matrix.target }}-${{ env.RUST_VERSION }}-
      - name: Build Linux release against glibc 2.28
        if: runner.os == 'Linux'
        run: bash tools/linux-checks/build.sh "$TARGET"
      - name: Prepare native macOS build
        if: runner.os == 'macOS'
        run: cargo xtask prepare
      - name: Set the fork release version
        run: echo "CELLD_RELEASE_VERSION=$(python3 tools/release.py version)" >> "$GITHUB_ENV"
      - name: Test cell packing and retirement
        if: runner.os == 'macOS'
        run: cargo test --manifest-path tools/packing-checks/Cargo.toml --locked
      - name: Build release binary
        if: runner.os == 'macOS'
        run: cargo xtask build --target "$TARGET" --release
      - name: Cache the successful build before running binary checks
        uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Verify Linux ABI and run on glibc 2.28
        if: runner.os == 'Linux'
        run: bash tools/linux-checks/check.sh "$TARGET"
      - name: Test S3 ETag spelling and conditional-write fencing through the binary
        run: python3 tools/storage-checks/probe.py "target/$TARGET/release/celld" -v
      - name: Test native Monty HTTP and durability
        run: |
          python3 tools/monty-checks/e2e.py "target/$TARGET/release/celld"
          "target/$TARGET/release/celld" types > generated.pyi
          cmp generated.pyi crates/monty-runtime/src/celld.pyi
      - name: Exercise Python install, init, check and pytest on this platform
        run: |
          python3 -m pip install '.[test]'
          python3 -m pytest python/tests examples/python-api/tests --celld-binary "target/$TARGET/release/celld" -q
      - name: Package and verify binary
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/celld"
          "$binary" --help | grep -F CELLD_S3_ETAG_MODE
          "$binary" --help | grep -F CELLD_MAX_CELLS_PER_ISOLATE
          python3 - <<'PY'
          import gzip, hashlib, json, os, pathlib, subprocess, tomllib
          target = os.environ['TARGET']
          binary = pathlib.Path(f'target/{target}/release/celld')
          upstream_version = tomllib.loads(pathlib.Path('target/celld/crates/celld/Cargo.toml').read_text())['package']['version']
          version = os.environ['CELLD_RELEASE_VERSION']
          reported = subprocess.check_output([str(binary), '--version'], text=True).strip()
          assert reported == f'celld {version}', reported
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['SOURCE_SHA']
          out = pathlib.Path('out'); out.mkdir()
          archive = out / f'celld-{target}.gz'
          with archive.open('wb') as output:
              subprocess.run(['gzip', '-9', '-n', '-c', str(binary)], stdout=output, check=True)
          assert gzip.decompress(archive.read_bytes()) == binary.read_bytes()
          linux_abi = json.loads(pathlib.Path('target/linux-abi.json').read_text()) if target.endswith('-linux-gnu') else None
          if linux_abi is not None:
              assert linux_abi['baseline'] == '2.28'
              assert linux_abi['binary_sha256'] == hashlib.sha256(binary.read_bytes()).hexdigest()
          (out / f'build-{target}.json').write_text(json.dumps({
              'target': target, 'version': version, 'source_sha': source,
              'upstream_version': upstream_version,
              'build_number': int(os.environ['GITHUB_RUN_NUMBER']),
              'repository': os.environ['GITHUB_REPOSITORY'],
              'upstream_revision': pathlib.Path('upstream/revision').read_text().strip(),
              'rust_version': os.environ['RUST_VERSION'], 'profile': 'release',
              'linux_abi': linux_abi,
              'archive': archive.name, 'sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: celld-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Verify complete release assets
    needs: [build, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: celld-*
          path: assets
          merge-multiple: true
      - name: Verify all platforms and write checksums
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json, os, pathlib, shutil
          from tools.release import release_version
          assets = pathlib.Path('assets')
          targets = {'x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu', 'aarch64-apple-darwin', 'x86_64-apple-darwin'}
          builds = [json.loads(p.read_text()) for p in sorted(assets.glob('build-*.json'))]
          assert len(builds) == len(targets)
          assert {b['target'] for b in builds} == targets
          assert len({b['version'] for b in builds}) == 1
          assert len({b['upstream_version'] for b in builds}) == 1
          checksums = []
          for b in builds:
              assert b['source_sha'] == os.environ['SOURCE_SHA']
              assert b['build_number'] == int(os.environ['GITHUB_RUN_NUMBER'])
              assert b['version'] == release_version(b['upstream_version'], b['build_number'])
              assert b['upstream_revision'] == pathlib.Path('upstream/revision').read_text().strip()
              assert b['repository'] == os.environ['GITHUB_REPOSITORY']
              assert b['profile'] == 'release'
              assert b['archive'] == f"celld-{b['target']}.gz"
              data = (assets / b['archive']).read_bytes()
              assert hashlib.sha256(data).hexdigest() == b['sha256']
              assert hashlib.sha256(gzip.decompress(data)).hexdigest() == b['binary_sha256']
              if b['target'].endswith('-linux-gnu'):
                  assert b['linux_abi']['baseline'] == '2.28'
                  assert tuple(map(int, b['linux_abi']['required_glibc'].split('.'))) <= (2, 28)
                  assert b['linux_abi']['binary_sha256'] == b['binary_sha256']
              else:
                  assert b['linux_abi'] is None
              checksums.append(f"{b['sha256']}  {b['archive']}")
          (assets / 'SHA256SUMS').write_text('\n'.join(sorted(checksums)) + '\n')
          (assets / 'BUILD_INFO.json').write_text(json.dumps(builds, indent=2) + '\n')
          shutil.copy('LICENSE', assets / 'LICENSE')
          shutil.copy('crates/monty-runtime/src/celld.pyi', assets / 'celld.pyi')
          for p in assets.glob('build-*.json'): p.unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: celld-release-assets
          path: assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish celld binaries
    needs: assemble
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: celld-release-publish
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: celld-release-assets
          path: assets
      - name: Publish exact source and all verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/release.py publish
